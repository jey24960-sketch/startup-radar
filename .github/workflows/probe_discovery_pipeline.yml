name: Probe StartupRadar discovery database transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe_discovery_pipeline.yml']
permissions:
  contents: read
jobs:
  probe:
    if: vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Read-only session-pool pipeline and rollback verification
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_DISCOVERY_SESSION_PIPELINE: 'true'
        run: python -m tools.probe_discovery_pipeline

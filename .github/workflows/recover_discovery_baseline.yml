name: Recover StartupRadar discovery baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover_discovery_baseline.yml']
permissions:
  contents: read
# An operator recovery can proceed if GitHub's regular workflow queue is stuck.
# The database's durable global execution claim and one retry audit remain authoritative.
concurrency:
  group: startup-radar-baseline-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Recover completed failed baseline once without publication or delivery
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python -m radar.cli discover --retry-failed

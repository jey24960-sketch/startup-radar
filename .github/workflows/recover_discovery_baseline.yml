name: Recover StartupRadar discovery baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover_discovery_baseline.yml']
permissions:
  contents: read
# Replace the known slow baseline only after its verified GitHub termination.
# The continuation tool preserves preimages and uses the durable global owner.
concurrency:
  group: startup-radar-baseline-recovery
  cancel-in-progress: true
jobs:
  recover:
    if: vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Continue the verified stopped baseline without publication or delivery
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_DISCOVERY_SESSION_PIPELINE: 'true'
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python -m tools.continue_discovery_baseline

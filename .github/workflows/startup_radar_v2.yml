name: StartupRadar Weekly
on:
  schedule:
    # Single production schedule: Tuesday 15:00 Asia/Seoul, existing weekly preference.
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      kind:
        description: Task kind
        type: choice
        options: [WEEKLY, INGEST, REFRESH]
        default: WEEKLY
      source_slug:
        description: Optional registered source slug
        type: string
      job_id:
        description: Persisted dashboard or Telegram request UUID
        type: string
      revision_note:
        description: Optional explicit reason to revise the published current-week issue
        type: string
      check_sources:
        description: Recheck official sources without revising an already published weekly issue
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: startup-radar-v2-state
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-v2.lock.txt
            requirements-ocr.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Prepare verified evidence runtime
        if: inputs.kind == 'INGEST'
        run: |
          pip install -r requirements-ocr.lock.txt
          python -m tools.prepare_ocr_models work/tessdata
          docker build -f Dockerfile.evidence --tag startup-radar-evidence:${{ github.sha }} .
          docker image inspect --format '{{.Id}}' startup-radar-evidence:${{ github.sha }}
      - name: Execute persistent V2 task
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KIND: ${{ inputs.kind || 'WEEKLY' }}
          SOURCE_SLUG: ${{ inputs.source_slug }}
          JOB_ID: ${{ inputs.job_id }}
          REVISION_NOTE: ${{ inputs.revision_note }}
          CHECK_SOURCES: ${{ inputs.check_sources }}
          DELIVERY_ENABLED: ${{ vars.RADAR_V2_DELIVERY_ENABLED }}
          RADAR_OCR_MODEL_DIR: work/tessdata
          RADAR_OCR_CACHE_DIR: work/ocr-cache
          RADAR_EVIDENCE_IMAGE: startup-radar-evidence:${{ github.sha }}
        shell: bash
        run: |
          if [ "$KIND" = 'WEEKLY' ]; then
            args=()
            if [ "$CHECK_SOURCES" = 'true' ]; then args+=(--check-sources); fi
            if [ -n "$REVISION_NOTE" ]; then args+=(--revision-note "$REVISION_NOTE"); fi
            if [ "$DELIVERY_ENABLED" = 'true' ]; then args+=(--deliver); fi
            python -m radar.cli weekly "${args[@]}"
            exit $?
          fi
          args=(--kind "$KIND")
          if [ -n "$SOURCE_SLUG" ]; then args+=(--source "$SOURCE_SLUG"); fi
          if [ -n "$JOB_ID" ]; then args+=(--job-id "$JOB_ID"); fi
          # Advanced/manual jobs never send normal GFC per-program notifications.
          python -m radar.cli run "${args[@]}"
      - name: Remove interrupted evidence workers
        if: always()
        run: docker ps -aq --filter label=startup-radar.evidence=true | xargs --no-run-if-empty docker rm --force

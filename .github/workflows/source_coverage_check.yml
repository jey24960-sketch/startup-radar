name: StartupRadar source coverage check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_coverage_check.yml'
      - 'weekly-direct-sources.json'
      - 'radar/official_facts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startup-radar-v2-state
  cancel-in-progress: false
jobs:
  source-check:
    if: vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Persist public official facts without publication or delivery
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_DISCOVERY_SESSION_PIPELINE: 'true'
          RADAR_ACTIONS_REPORT: 'true'
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python -m radar.cli check-discovery-sources

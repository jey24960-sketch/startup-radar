name: StartupRadar Internal Discovery
on:
  schedule:
    # 06:17 and 18:17 Asia/Seoul. Members still receive a weekly briefing.
    - cron: '17 21,9 * * *'
  workflow_dispatch:
    inputs:
      deliver:
        description: Permit an eligible exceptional notice (never a daily digest)
        type: boolean
        default: false
      retry_failed:
        description: Retry the current completed failed source slot once; no publication or delivery
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: startup-radar-v2-state
  cancel-in-progress: false
jobs:
  discover:
    if: vars.RADAR_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.lock.txt
      - run: pip install -r requirements-v2.lock.txt
      - name: Diagnose public official endpoints without credentials
        shell: bash
        run: |
          # No keys, response bodies, TLS bypasses, or alternate access paths.
          # Diagnostic failure remains visible but never prevents the collector.
          for url in \
            'https://apis.data.go.kr/robots.txt' \
            'https://apis.data.go.kr/B552735/kisedKstartupService01/getAnnouncementInformation01' \
            'https://www.bizinfo.go.kr/robots.txt' \
            'https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do'; do
            curl --silent --output /dev/null --connect-timeout 20 --max-time 20 \
              --write-out "${url} http_status=%{http_code} connect_seconds=%{time_connect} total_seconds=%{time_total}\\n" \
              "$url" || true
          done
      - name: Collect official facts, preserving weekly member delivery
        env:
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_DISCOVERY_SESSION_PIPELINE: 'true'
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DELIVERY_ENABLED: ${{ vars.RADAR_V2_DELIVERY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DELIVERY: ${{ inputs.deliver }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        shell: bash
        run: |
          args=()
          if [ "$RETRY_FAILED" = 'true' ]; then
            if [ "$MANUAL_DELIVERY" = 'true' ]; then
              echo 'A failed-slot retry cannot be combined with delivery.'
              exit 2
            fi
            args+=(--retry-failed)
          fi
          # Only the schedule or an explicit manual request permits delivery.
          # The existing delivery gate and activated DB policy remain required.
          if [ "$RETRY_FAILED" != 'true' ] && [ "$DELIVERY_ENABLED" = 'true' ] && { [ "$EVENT_NAME" = 'schedule' ] || [ "$MANUAL_DELIVERY" = 'true' ]; }; then
            args+=(--deliver)
          fi
          python -m radar.cli discover "${args[@]}"
